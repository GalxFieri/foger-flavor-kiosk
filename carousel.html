<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Foger Switch — Flavor Carousel</title>
<link rel="stylesheet" href="carousel.css" />
</head>
<body>
  <div class="aurora" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- idle attract -->
  <section id="attract" class="attract" aria-hidden="true">
    <div class="attract-inner">
      <p class="attract-kicker">Foger&nbsp;Switch</p>
      <h1 class="attract-title">Flavor<br/>Menu</h1>
      <p class="attract-sub">Tap anywhere to explore<br/><span id="attractCount">90</span> flavors</p>
      <div class="attract-pulse" aria-hidden="true"></div>
    </div>
  </section>

  <main id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">F</span>
        <span class="brand-text"><span class="brand-name">FOGER SWITCH</span><span class="brand-tag">Flavor Menu</span></span>
      </div>
    </header>

    <nav id="filters" class="filters" aria-label="Filter by category"></nav>
    <div class="count-row"><span id="resultCount" class="result-count"></span></div>

    <div class="carousel-wrap">
      <button id="prevBtn" class="nav-arrow left" aria-label="Previous flavor">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="stage" class="stage">
        <div id="track" class="track"></div>
      </div>
      <button id="nextBtn" class="nav-arrow right" aria-label="Next flavor">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <p id="empty" class="empty" hidden>No flavors match that filter.</p>
  </main>

  <script src="pod-art.js"></script>
  <script src="kiosk-store.js"></script>
  <script src="carousel.js"></script>
</body>
</html>
